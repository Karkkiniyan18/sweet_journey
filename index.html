<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | Sweet Journey</title>
  <style>
/* Inlined from Sweet_Journey_updated_images/style.css */
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap');

:root{
  --ink:#211c1a;--brown:#9a6b49;--cream:#f7f3ee;--sand:#d7c6b2;--line:#e7ded5;
  --white:#fff;--muted:#756b64;--max:1180px;
}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--cream);color:var(--ink);font-family:"DM Sans",sans-serif;line-height:1.6}a{text-decoration:none;color:inherit}button,input,select,textarea{font:inherit}button{cursor:pointer}
.section{width:min(var(--max),calc(100% - 48px));margin:0 auto;padding:88px 0}.eyebrow{font-size:12px;letter-spacing:2px;font-weight:700;color:var(--brown);margin:0 0 14px}.muted{color:var(--muted)}.small{font-size:13px}
h1,h2{line-height:1.08;margin:0 0 22px}h1,h2{font-family:"Playfair Display",serif;font-weight:600}h1{font-size:clamp(44px,6vw,82px)}h2{font-size:clamp(32px,4vw,52px)}p{margin:0 0 18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:25px;padding:14px 20px;border:1px solid transparent;font-weight:700;transition:.2s}.btn-dark{background:var(--ink);color:white}.btn-dark:hover{background:var(--brown)}.btn-light{background:white;color:var(--ink)}.btn-outline{background:transparent;border-color:var(--ink)}.text-link{font-weight:700;border-bottom:1px solid var(--ink);padding-bottom:4px}
.site-header{background:var(--cream);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}.nav{width:min(var(--max),calc(100% - 48px));margin:auto;min-height:86px;display:flex;align-items:center;justify-content:space-between;gap:25px}.logo{font-family:"Playfair Display",serif;font-size:28px;font-weight:700}.nav-links{display:flex;gap:27px;align-items:center;font-size:14px;font-weight:600}.nav-links a:hover{color:var(--brown)}.nav-toggle{display:none;border:0;background:none;font-size:25px}
.hero{display:grid;grid-template-columns:1fr 1fr;gap:70px;align-items:center;min-height:620px}.hero h1 span{color:var(--brown)}.hero-text{max-width:440px;color:var(--muted);font-size:18px}.hero-actions{display:flex;align-items:center;gap:28px;margin-top:30px}.image-placeholder{background:linear-gradient(135deg,#e9e0d7,#cdb9a5);min-height:230px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#7e6654;border:1px solid #cdbba9;position:relative;overflow:hidden}.image-placeholder:before{content:"";position:absolute;inset:18px;border:1px dashed #a78a70;pointer-events:none}.image-placeholder span{font-size:13px;font-weight:700;letter-spacing:2px}.image-placeholder small{max-width:250px;margin-top:8px;padding:0 20px}.large-placeholder{min-height:470px}.feature-strip{background:var(--white);border-top:1px solid var(--line);border-bottom:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:28px max(24px,calc((100% - var(--max))/2));gap:20px}.feature-strip div{display:flex;flex-direction:column;gap:5px}.feature-strip strong{font-family:"Playfair Display",serif;font-size:25px;color:var(--brown)}.feature-strip span{font-size:13px;font-weight:700}
.section-heading{display:flex;justify-content:space-between;align-items:end;gap:25px;margin-bottom:35px}.heading-note{max-width:250px;font-size:14px}.gallery-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}.gallery-card{background:var(--white);padding:12px}.gallery-card .image-placeholder{min-height:250px}.gallery-card p{font-weight:700;margin:14px 5px 4px}
.cta{background:var(--brown);color:white;display:flex;justify-content:space-between;align-items:center;gap:30px;width:100%;max-width:none;padding-left:max(24px,calc((100% - var(--max))/2));padding-right:max(24px,calc((100% - var(--max))/2))}.cta .eyebrow{color:#f5dfca}.cta p{max-width:600px}.cta h2{margin-bottom:12px}
.page-intro{padding-bottom:45px}.page-intro h1{max-width:780px}.page-intro>p:last-child{max-width:650px;color:var(--muted);font-size:18px}
.order-layout{display:grid;grid-template-columns:1.5fr .8fr;gap:65px;padding-top:25px}.form-card,.contact-card,.price-card,.summary-box{background:white;border:1px solid var(--line);padding:32px}.form-section-title{display:flex;align-items:center;gap:15px;margin:25px 0}.form-section-title:first-child{margin-top:0}.form-section-title span{color:var(--brown);font-weight:700}.form-section-title h2{font-size:28px;margin:0}.two-col{display:grid;grid-template-columns:1fr 1fr;gap:20px}label{display:block;font-weight:700;font-size:14px;margin:15px 0 7px}input,select,textarea{width:100%;border:1px solid #d9cec4;background:#fff;padding:13px 14px;outline:none;color:var(--ink)}input:focus,select:focus,textarea:focus{border-color:var(--brown)}textarea{resize:vertical}.form-card .btn{margin-top:25px}.form-message{font-size:14px;font-weight:700;margin-top:15px}.order-summary{padding-top:20px}.order-summary h2{font-size:38px}.summary-box{margin:30px 0}.summary-box strong{font-size:18px}.summary-box ul{padding-left:20px;margin-bottom:0}.saved-orders{padding-top:10px}.orders-list{display:grid;gap:12px}.order-item{background:white;border:1px solid var(--line);padding:18px;display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}.order-item strong{display:block}.order-item small{color:var(--muted)}
.contact-grid{display:grid;grid-template-columns:1fr 1fr;gap:60px;align-items:stretch}.contact-card h2{font-size:44px}.contact-line{display:block;font-size:20px;font-weight:700;margin:16px 0}.contact-label{margin-top:38px}.contact-image{min-height:420px}.about-block{max-width:850px;margin-left:max(24px,calc((100% - var(--max))/2));margin-right:max(24px,calc((100% - var(--max))/2));padding-top:20px}.about-block p{font-size:18px;color:var(--muted)}
.price-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:25px;padding-top:20px}.price-card{position:relative}.price-card h2{font-size:35px}.price{font-family:"Playfair Display",serif;font-size:52px;font-weight:700;color:var(--brown)}.price span{font-family:"DM Sans",sans-serif;font-size:14px;color:var(--muted)}.price-card ul{padding-left:20px;color:var(--muted);margin:25px 0}.featured-price{border:2px solid var(--brown)}.price-tag{position:absolute;top:0;right:0;background:var(--brown);color:white;padding:7px 12px;font-size:11px;font-weight:700;letter-spacing:1px}.price-note{background:white;border:1px solid var(--line);text-align:center}.price-note p{max-width:600px;margin:0 auto 25px;color:var(--muted)}
.site-footer{background:var(--ink);color:white;padding:45px 24px}.footer-inner{width:min(var(--max),100%);margin:auto;display:flex;justify-content:space-between;gap:25px;flex-wrap:wrap}.footer-inner p{color:#c9bdb4;font-size:14px}.footer-links{display:flex;gap:20px;font-size:14px}.footer-links a:hover{color:#d7b18e}
.login-page{background:var(--brown);min-height:100vh;display:grid;place-items:center;padding:30px}.login-shell{width:min(1050px,100%);display:grid;grid-template-columns:1fr 420px;gap:60px;align-items:center}.login-brand{color:white}.login-brand .eyebrow{color:#f0d9c5}.login-brand h1{font-size:clamp(65px,8vw,110px);margin-bottom:25px}.login-brand h1 span{color:#e9c6a5}.login-brand p:last-child{max-width:430px;font-size:18px;color:#f0ded0}.login-card{background:var(--cream);padding:45px;box-shadow:0 20px 70px #4c302055}.brand-mark{width:48px;height:48px;background:var(--brown);color:white;display:grid;place-items:center;font-weight:700;margin-bottom:28px}.login-card h2{font-size:38px;margin-bottom:10px}.login-card .btn{width:100%;margin-top:20px}.login-note{font-size:12px;color:var(--muted);margin-top:25px}
@media(max-width:850px){.nav-links{display:none;position:absolute;left:0;right:0;top:86px;background:var(--cream);padding:20px 24px;flex-direction:column;align-items:flex-start;border-bottom:1px solid var(--line)}.nav-links.open{display:flex}.nav-toggle{display:block}.hero,.order-layout,.contact-grid{grid-template-columns:1fr;gap:35px}.hero{padding-top:55px}.large-placeholder{min-height:350px}.gallery-grid,.price-grid{grid-template-columns:repeat(2,1fr)}.feature-strip{grid-template-columns:repeat(2,1fr)}.section-heading{align-items:start;flex-direction:column}.heading-note{max-width:none}.login-shell{grid-template-columns:1fr;gap:25px}.login-brand{text-align:center}.login-brand h1{font-size:70px}.login-brand p:last-child{margin:0 auto}.login-card{max-width:500px;width:100%;margin:auto}}
@media(max-width:540px){.section{width:min(100% - 32px, var(--max));padding:55px 0}.nav{width:calc(100% - 32px)}.gallery-grid,.price-grid,.two-col{grid-template-columns:1fr}.hero h1{font-size:52px}.hero-actions{flex-wrap:wrap}.feature-strip{padding:25px 16px}.form-card,.contact-card,.price-card{padding:24px}.login-page{padding:16px}.login-card{padding:30px 24px}.login-brand h1{font-size:58px}.cta{align-items:flex-start;flex-direction:column}}

.photo-frame{background:#fff;border:1px solid var(--line);overflow:hidden;display:flex;align-items:center;justify-content:center;min-height:230px}
.photo-frame img{width:100%;height:100%;min-height:230px;object-fit:cover;display:block}
.hero-art.photo-frame{min-height:470px}
.hero-art.photo-frame img{min-height:470px}
.contact-image.photo-frame{min-height:420px}
.contact-image.photo-frame img{min-height:420px}
@media(max-width:850px){
  .hero-art.photo-frame,.hero-art.photo-frame img{min-height:350px}
}

</style>
</head>
<body class="login-page">
  <main class="login-shell">
    <section class="login-brand">
      <p class="eyebrow">HANDMADE • PERSONAL • SWEET</p>
      <h1>Sweet<br><span>Journey</span></h1>
      <p>Beautiful chocolate wrappers for birthdays, weddings, celebrations and every little happy moment.</p>
    </section>

    <section class="login-card">
      <div class="brand-mark">SJ</div>
      <h2>Welcome to Sweet Journey</h2>
      <p class="muted">Enter your Gmail and mobile number to continue.</p>

      <form id="loginForm">
        <label for="gmail">Gmail address</label>
        <input id="gmail" name="gmail" type="email" placeholder="you@gmail.com" required />

        <label for="mobile">Mobile number</label>
        <input id="mobile" name="mobile" type="tel" inputmode="numeric"
               pattern="[0-9+\-\s]{10,15}" placeholder="98765 43210" required />

        <button class="btn btn-dark" type="submit">Continue <span>→</span></button>
        <p id="loginMessage" class="form-message" aria-live="polite"></p>
      </form>

      <p class="login-note">Demo login: enter a valid Gmail address and mobile number.</p>
    </section>
  </main>
  <script>
/* Inlined from Sweet_Journey_updated_images/script.js */
// Shared header and footer
const header = document.getElementById("siteHeader");
const footer = document.getElementById("siteFooter");

if (header) {
  header.innerHTML = `
    <header class="site-header">
      <nav class="nav">
        <a class="logo" href="home.html">Sweet Journey</a>
        <button class="nav-toggle" aria-label="Toggle navigation">☰</button>
        <div class="nav-links">
          <a href="home.html">Home</a>
          <a href="orders.html">Create Order</a>
          <a href="prices.html">Prices</a>
          <a href="contact.html">Contact</a>
          <a class="btn btn-dark" href="orders.html">Order now →</a>
        </div>
      </nav>
    </header>`;
  const toggle = header.querySelector(".nav-toggle");
  const links = header.querySelector(".nav-links");
  toggle.addEventListener("click", () => links.classList.toggle("open"));
}

if (footer) {
  footer.innerHTML = `
    <footer class="site-footer">
      <div class="footer-inner">
        <div><div class="logo">Sweet Journey</div><p>Chocolate wrappers made for sweet memories.</p></div>
        <div class="footer-links"><a href="home.html">Home</a><a href="orders.html">Orders</a><a href="prices.html">Prices</a><a href="contact.html">Contact</a></div>
      </div>
    </footer>`;
}

// Demo login using Gmail and mobile number
const loginForm = document.getElementById("loginForm");
if (loginForm) {
  loginForm.addEventListener("submit", (event) => {
    event.preventDefault();
    const message = document.getElementById("loginMessage");
    const gmail = document.getElementById("gmail").value.trim();
    const mobile = document.getElementById("mobile").value.trim();

    if (gmail && mobile) {
      localStorage.setItem("sweetJourneyUser", JSON.stringify({ gmail, mobile }));
      message.textContent = "Details accepted. Redirecting...";
      setTimeout(() => window.location.href = "home.html", 500);
    }
  });
}

// Orders demo storage
const orderForm = document.getElementById("orderForm");
const ordersList = document.getElementById("ordersList");

function getOrders() {
  return JSON.parse(localStorage.getItem("sweetJourneyOrders") || "[]");
}

function renderOrders() {
  if (!ordersList) return;
  const orders = getOrders();
  if (!orders.length) {
    ordersList.innerHTML = '<p class="muted">No orders saved yet.</p>';
    return;
  }
  ordersList.innerHTML = orders.map((order, index) => `
    <div class="order-item">
      <div><strong>${escapeHTML(order.name)} — ${escapeHTML(order.occasion)}</strong>
      <small>${escapeHTML(order.phone)} · ${order.quantity} pieces · ${escapeHTML(order.wrapper)}</small>
      <br><small>${escapeHTML(order.notes || "No additional notes")}</small></div>
      <div><small>Order #${index + 1}<br>${escapeHTML(order.date || "No date")}</small></div>
    </div>`).join("");
}

function escapeHTML(value) {
  return String(value).replace(/[&<>"']/g, char => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  }[char]));
}

if (orderForm) {
  orderForm.addEventListener("submit", (event) => {
    event.preventDefault();
    const file = document.getElementById("referenceImage").files[0];
    const order = {
      name: document.getElementById("customerName").value,
      phone: document.getElementById("phone").value,
      email: document.getElementById("email").value,
      occasion: document.getElementById("occasion").value,
      quantity: document.getElementById("quantity").value,
      wrapper: document.getElementById("wrapperType").value,
      date: document.getElementById("deliveryDate").value,
      notes: document.getElementById("designNotes").value + (file ? ` | Reference: ${file.name}` : "")
    };
    const orders = getOrders();
    orders.push(order);
    localStorage.setItem("sweetJourneyOrders", JSON.stringify(orders));
    document.getElementById("orderMessage").textContent = "Order saved successfully in this browser.";
    orderForm.reset();
    renderOrders();
  });
}

const clearOrders = document.getElementById("clearOrders");
if (clearOrders) {
  clearOrders.addEventListener("click", () => {
    localStorage.removeItem("sweetJourneyOrders");
    renderOrders();
  });
}
renderOrders();

</script>
</body>
</html>
